<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wurst — Music visualizer for Mac</title>
<meta name="description" content="Wurst is a macOS music visualizer. It renders whatever your Mac is playing as one turning sausage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --smoke:#1A1310;
    --smoke-2:#241A15;
    --fat:#F3E7D3;
    --mustard:#E5B23A;
    --line:rgba(243,231,211,.16);
    --serif:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{height:100%}
  main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  body{
    margin:0;background:var(--smoke);color:var(--fat);
    font-family:var(--sans);font-size:16px;line-height:1.55;
    min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden;
  }
  a{color:inherit}
  :focus-visible{outline:2px solid var(--mustard);outline-offset:3px;border-radius:2px}


  .stage{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(10px,2.2vh,22px) clamp(14px,4vw,48px) clamp(6px,1.2vh,14px);
    text-align:center;
    background:radial-gradient(110% 78% at 50% 52%, var(--smoke-2) 0%, var(--smoke) 66%);
  }

  .picker-label{margin:0 0 clamp(5px,.9vh,10px);font-size:13px;opacity:.5}
  .picker-row{
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
    list-style:none;margin:0 0 clamp(8px,1.6vh,18px);padding:0;
  }
  #tune-label{margin-top:clamp(6px,1.2vh,14px)}
  #tune-grid{margin-bottom:0}
  .casing{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 13px 6px 8px;border-radius:999px;
    border:1px solid var(--line);background:transparent;color:var(--fat);
    font:inherit;font-size:13px;cursor:pointer;opacity:.55;
  }
  .casing:hover{opacity:.85}
  .casing[aria-pressed="true"]{opacity:1;border-color:rgba(243,231,211,.55)}
  .swatch{
    flex:none;width:24px;height:10px;border-radius:999px;
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.4), inset 0 2px 2px rgba(255,255,255,.3);
  }

  .lockup{
    margin:0;font-family:var(--serif);
    font-variation-settings:"wght" 800,"wdth" 84,"opsz" 96;
    font-size:clamp(30px,6.6vh,84px);
    line-height:.9;letter-spacing:-.035em;user-select:none;
  }
  .stage-canvas{flex:1 1 auto;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}
  .stage-canvas canvas{display:block;height:100%;width:auto;aspect-ratio:1;max-width:100%}

  .stage-controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:clamp(2px,.6vh,8px)}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:8px 15px 8px 13px;border:1px solid var(--line);border-radius:999px;
    background:rgba(243,231,211,.04);color:var(--fat);font:inherit;font-size:13px;cursor:pointer;
  }
  .btn:hover{background:rgba(243,231,211,.09)}
  .btn-quiet{padding:8px 14px;opacity:.6}
  .btn-quiet:hover{opacity:.9}
  #rand[aria-pressed="true"]{opacity:1;border-color:var(--mustard);color:var(--mustard)}
  .btn[disabled]{opacity:.3;cursor:default}
  .btn-big{
    margin:clamp(8px,1.5vh,16px) 0 clamp(6px,1.2vh,14px);
    padding:clamp(10px,1.7vh,15px) clamp(26px,5vw,38px);border-color:transparent;
    background:var(--mustard);color:#241A15;
    font-family:var(--serif);font-variation-settings:"wght" 700,"wdth" 90,"opsz" 24;
    font-size:clamp(17px,2.9vh,24px);letter-spacing:-.015em;
  }
  .btn-big:hover{background:#F0C356}
  .btn-big[disabled]{background:var(--mustard)}
  .btn .icon{font-size:11px;color:var(--mustard)}
  .btn .bars{display:none;align-items:flex-end;gap:2px;height:13px}
  .btn[aria-pressed="true"] .bars{display:flex}
  .btn[aria-pressed="true"] .icon{display:none}
  .bars i{
    display:block;width:2px;background:var(--mustard);height:calc(var(--h) * 1px);
    animation:jig .7s steps(4,end) infinite alternate;
    animation-delay:calc(var(--h) * -19ms);
  }
  @keyframes jig{from{transform:scaleY(.35)}to{transform:scaleY(1)}}

  .lead{
    flex:none;max-width:56ch;margin:0 auto;
    padding:0 clamp(14px,4vw,48px) clamp(4px,.8vh,10px);
    text-align:center;
  }
  .lead h1{
    font-family:var(--serif);font-variation-settings:"wght" 700,"wdth" 88,"opsz" 40;
    font-size:clamp(28px,4.6vw,44px);letter-spacing:-.025em;line-height:1.05;margin:0 0 16px;
  }
  .lead p{margin:0;font-size:clamp(13px,1.7vh,16px)}
  .lead .cta{
    display:inline-block;margin-top:clamp(4px,.9vh,10px);
    font-family:var(--serif);font-variation-settings:"wght" 700,"wdth" 88,"opsz" 18;
    font-size:clamp(14px,1.9vh,17px);text-decoration:none;padding-bottom:3px;border-bottom:2px solid var(--mustard);
  }
  .lead .cta:hover{color:var(--mustard)}
  .lead .version{margin-top:clamp(3px,.7vh,8px);font-size:12px;opacity:.45}

  .site-footer{
    flex:none;padding:0 clamp(14px,4vw,48px) clamp(8px,1.6vh,18px);
    text-align:center;font-size:12px;opacity:.4;
  }
  @media (prefers-reduced-motion:reduce){ .bars i{animation:none} }
</style>
</head>
<body>


<main id="top">
  <section class="stage">
    <p class="picker-label" id="picker-label">Choose your sausage</p>
    <ul class="picker-row" id="casing-grid" aria-labelledby="picker-label"></ul>

    <p class="picker-label" id="tune-label">Choose your music</p>
    <ul class="picker-row" id="tune-grid" aria-labelledby="tune-label"></ul>

    <div class="stage-controls">
      <button type="button" class="btn" id="play" aria-pressed="false">
        <span class="icon" aria-hidden="true">▶</span>
        <span class="bars" aria-hidden="true"><i style="--h:4"></i><i style="--h:11"></i><i style="--h:7"></i><i style="--h:13"></i><i style="--h:9"></i><i style="--h:12"></i><i style="--h:6"></i><i style="--h:13"></i></span>
        <span id="play-label">Play music</span>
      </button>
      <button type="button" class="btn btn-quiet" id="stopmusic">Stop music</button>
      <button type="button" class="btn btn-quiet" id="rand" aria-pressed="false">Let Tilly Loose</button>
      <button type="button" class="btn btn-quiet" id="clean">Wipe the sauce</button>
    </div>

    <button type="button" class="btn btn-big" id="tilly">Call Tilly</button>

    <p class="lockup">Wurst</p>
    <div class="stage-canvas">
      <canvas id="link" role="img" aria-label="A sausage turning slowly, bouncing with the beat, gathering sauce and dripping fat"></canvas>
    </div>

  </section>

  <section class="lead" id="download">
    <p>Enjoy a dancing sausage whilst you work. But watch out for naughty sausage stealing Tilly!</p>
    <a class="cta" href="#download">Download Wurst</a>
    <p class="version">Version 1.9.2. Free range. macOS 13 or later.</p>
  </section>
</main>

<footer class="site-footer">© 2026 Rebecca “WURST CASE SCENARIO” Closure</footer>

<script>
(function(){
  "use strict";

  /* ================= casings ================= */
  var CASINGS = [
    {name:"Bratwurst",    base:"#D9A96A", light:"#F2D3A0", dark:"#7A4E22", speck:"#F6E9CF", speckA:.55, glow:"#E0A24E"},
    {name:"Cumberland",   base:"#C1793B", light:"#E8B478", dark:"#5F3115", speck:"#F0DCB6", speckA:.5,  glow:"#D08A3E"},
    {name:"Chorizo",      base:"#B03A22", light:"#DD7448", dark:"#4C160B", speck:"#F0A24A", speckA:.6,  glow:"#D64A22"},
    {name:"Frankfurter",  base:"#D08663", light:"#EFB395", dark:"#6E3721", speck:"#EFC7AE", speckA:.18, glow:"#E08A5E"},
    {name:"Merguez",      base:"#96311F", light:"#C55C3C", dark:"#3D1109", speck:"#E07A3A", speckA:.5,  glow:"#BE3C1E"},
    {name:"Andouille",    base:"#5A3524", light:"#8D5C3C", dark:"#20100A", speck:"#C89B6A", speckA:.45, glow:"#8A4E2A"},
    {name:"Black pudding",base:"#33202A", light:"#5E3B45", dark:"#120A0F", speck:"#F3E7D3", speckA:.7,  glow:"#6A3446"},
    {name:"Meat-free",    base:"#C2AE84", light:"#E4D7B2", dark:"#6B5C38", speck:"#7E8F4E", speckA:.6,  glow:"#B9AE6E"}
  ];
  var casing = CASINGS[0];

  var grid = document.getElementById("casing-grid");
  CASINGS.forEach(function(c, i){
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button"; b.className = "casing";
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    var sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = "linear-gradient(180deg," + c.light + "," + c.base + " 55%," + c.dark + ")";
    b.appendChild(sw);
    b.appendChild(document.createTextNode(c.name));
    b.addEventListener("click", function(){
      casing = c;
      Array.prototype.forEach.call(grid.querySelectorAll(".casing"), function(o){
        o.setAttribute("aria-pressed", o === b ? "true" : "false");
      });
    });
    li.appendChild(b);
    grid.appendChild(li);
  });

  /* ================= canvas ================= */
  var cv = document.getElementById("link");
  var ctx = cv.getContext("2d");
  var sauceCv = document.createElement("canvas");
  var sctx = sauceCv.getContext("2d");

  var W = 0, H = 0, dpr = 1, cx = 0, cy = 0;
  var pts = [], rad = new Float32Array(1), rBase = 12, level = new Float32Array(1);
  var specks = [], sizzle = [], drops = [], fats = [];
  var pulse = 0, angle = 0, spin = 0, bob = 0, bobV = 0, fatTimer = .4;

  for(var s = 0; s < 80; s++){
    specks.push({t: Math.random(), o: Math.random() * 1.6 - .8, r: .5 + Math.random() * 1.4});
  }

  function resize(){
    var r = cv.getBoundingClientRect();
    if(!r.width) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height; cx = W / 2; cy = H / 2;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sauceCv.width = Math.round(W * dpr); sauceCv.height = Math.round(H * dpr);
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function build(){
    var S = Math.min(W, H), D = S * 0.58;
    var R = D * 0.36, legLen = D * 0.46;
    var byTop = cy - D * 0.42, byBend = byTop + legLen;
    rBase = D * 0.135;

    var raw = [], nLeg = 52, nArc = 66, i;
    for(i = 0; i < nLeg; i++) raw.push({x: cx - R, y: byTop + legLen * (i / nLeg)});
    for(i = 0; i <= nArc; i++){
      var th = Math.PI - Math.PI * (i / nArc);
      raw.push({x: cx + R * Math.cos(th), y: byBend + R * Math.sin(th)});
    }
    for(i = 1; i <= nLeg; i++) raw.push({x: cx + R, y: byBend - legLen * (i / nLeg)});

    var far = 0;
    for(i = 0; i < raw.length; i++) far = Math.max(far, Math.hypot(raw[i].x - cx, raw[i].y - cy));
    var k = (S * 0.42 - rBase * 1.5) / far;
    if(k < 1){
      for(i = 0; i < raw.length; i++){
        raw[i].x = cx + (raw[i].x - cx) * k;
        raw[i].y = cy + (raw[i].y - cy) * k;
      }
      rBase *= k;
    }
    for(i = 0; i < raw.length; i++){
      var a = raw[Math.max(0, i - 1)], b = raw[Math.min(raw.length - 1, i + 1)];
      var dx = b.x - a.x, dy = b.y - a.y, m = Math.hypot(dx, dy) || 1;
      raw[i].nx = -dy / m; raw[i].ny = dx / m;
      raw[i].t = i / (raw.length - 1);
    }
    pts = raw;
    if(level.length !== pts.length){ level = new Float32Array(pts.length); rad = new Float32Array(pts.length); }
  }

  /* ================= audio ================= */
  var ac = null, master = null, analyser = null, freq = null;
  var running = false, timer = null, step = 0, nextTime = 0, noiseBuf = null;
  var kicks = [];
  var styleKey = "grill", bar = 0;

  function stepDur(){ return (60 / STYLES[styleKey].bpm) / 4; }

  function makeNoise(){
    var len = Math.floor(ac.sampleRate * 2);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function noiseVoice(time, dur, type, f, q, gain){
    var src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    var flt = ac.createBiquadFilter(); flt.type = type; flt.frequency.value = f; flt.Q.value = q;
    var g = ac.createGain();
    g.gain.setValueAtTime(gain, time);
    g.gain.exponentialRampToValueAtTime(0.0008, time + dur);
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(time); src.stop(time + dur + .02);
  }

  /* a low hit, and the beat marker the visuals follow */
  function kickV(time, f0, f1, gain, dur, w){
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(f0, time);
    o.frequency.exponentialRampToValueAtTime(f1, time + dur * .45);
    g.gain.setValueAtTime(gain, time);
    g.gain.exponentialRampToValueAtTime(.0008, time + dur);
    o.connect(g); g.connect(master);
    o.start(time); o.stop(time + dur + .02);
    kicks.push({t: time, w: w === undefined ? 1 : w});
  }

  function tone(time, hz, type, dur, gain, cut, attack){
    var o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = type; o.frequency.value = hz;
    f.type = "lowpass"; f.frequency.value = cut || 3000; f.Q.value = 1;
    var a = attack || .008;
    g.gain.setValueAtTime(.0008, time);
    g.gain.exponentialRampToValueAtTime(gain, time + a);
    g.gain.exponentialRampToValueAtTime(.0008, time + dur);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(time); o.stop(time + dur + .02);
  }

  var STYLES = {
    grill: {
      name: "Grill", bpm: 112,
      play: function(i, time){
        var BASSLINE = [55, 0, 0, 55, 0, 0, 65.41, 0, 73.42, 0, 0, 82.41, 0, 0, 65.41, 0];
        if(i === 0 || i === 7 || i === 10) kickV(time, 125, 44, .85, .24, 1);
        if(i === 4 || i === 12) noiseVoice(time, .16, "bandpass", 1850, 1.1, .34);
        if(i % 2 === 1) noiseVoice(time, .035, "highpass", 7200, .8, .12);
        var hz = BASSLINE[i];
        if(hz) tone(time, hz, "sawtooth", .22, .3, 420);
      }
    },

    country: {
      name: "Country", bpm: 120,
      play: function(i, time){
        /* G  G  C  D */
        var CH = [[98, 196, 246.94, 293.66], [98, 196, 246.94, 293.66],
                  [65.41, 130.81, 164.81, 196], [73.42, 146.83, 185, 220]];
        var c = CH[bar % 4];
        if(i === 0 || i === 8) kickV(time, 92, 46, .6, .22, 1);
        if(i === 4 || i === 12) noiseVoice(time, .13, "bandpass", 2300, 1.2, .26);
        if(i % 2 === 0) noiseVoice(time, .028, "highpass", 8200, .8, .05);
        /* boom on the beat, chick off it */
        if(i === 0 || i === 8) tone(time, c[0], "triangle", .3, .34, 900);
        if(i === 4 || i === 12) tone(time, c[0] * 1.5, "triangle", .26, .3, 900);
        /* guitar, strummed slightly late note by note */
        if(i % 4 === 2){
          for(var k = 1; k < 4; k++) tone(time + k * .013, c[k] * 2, "sawtooth", .34, .075, 2600);
        }
      }
    },

    merengue: {
      name: "Merengue", bpm: 142,
      play: function(i, time){
        /* Am  Am  Dm  E */
        var ROOT = [110, 110, 146.83, 164.81][bar % 4];
        noiseVoice(time, .026, "highpass", 6800, .9, i % 2 === 0 ? .15 : .08);   /* güira */
        if(i === 0 || i === 6 || i === 8 || i === 14) kickV(time, 112, 52, .7, .19, 1);
        if(i === 3 || i === 11) noiseVoice(time, .07, "bandpass", 950, 2.2, .3);  /* slap */
        if(i === 0 || i === 8) tone(time, ROOT, "sawtooth", .18, .32, 700);
        if(i === 3) tone(time, ROOT * 1.5, "sawtooth", .16, .28, 700);
        if(i === 11) tone(time, ROOT * 1.335, "sawtooth", .16, .28, 700);
        if(i % 2 === 1) tone(time, ROOT * 4, "triangle", .09, .07, 3200);        /* jaleo */
      }
    },

    rocknroll: {
      name: "Rock and roll", bpm: 168,
      play: function(i, time){
        /* A  A  D  E, walked as a boogie */
        var ROOT = [110, 110, 146.83, 164.81][bar % 4];
        var WALK = [0, 4, 7, 9, 10, 9, 7, 4], k;
        if(i === 0 || i === 8) kickV(time, 120, 48, .8, .2, 1);
        if(i === 4 || i === 12) noiseVoice(time, .18, "bandpass", 1700, .9, .38);
        if(i % 2 === 0) noiseVoice(time, .03, "highpass", 7600, .8, .09);
        if(i % 2 === 0) tone(time, ROOT * Math.pow(2, WALK[i / 2] / 12), "square", .16, .26, 900);
        if(i === 4 || i === 12){
          for(k = 0; k < 3; k++){
            tone(time + k * .009, ROOT * 2 * Math.pow(2, [0, 4, 7][k] / 12), "sawtooth", .2, .08, 2500);
          }
        }
      }
    },

    classical: {
      name: "Classical", bpm: 96,
      play: function(i, time){
        /* C  Am  F  G */
        var PROG = [[130.81, 164.81, 196], [110, 130.81, 164.81],
                    [87.31, 130.81, 174.61], [98, 123.47, 146.83]];
        var ch = PROG[bar % 4], k;
        if(i === 0){
          for(k = 0; k < 3; k++) tone(time, ch[k], "triangle", 2.0, .11, 1500, .3);
          kickV(time, 72, 44, .16, .3, .6);
        }
        if(i === 8) kickV(time, 72, 44, .1, .26, .4);
        var arp = [ch[0] * 4, ch[1] * 4, ch[2] * 4, ch[1] * 4];
        tone(time, arp[i % 4] * (i >= 12 ? 2 : 1), "sine", .24, .13, 4200);
      }
    }
  };

  function schedule(){
    while(nextTime < ac.currentTime + .18){
      STYLES[styleKey].play(step, nextTime);
      nextTime += stepDur();
      step = (step + 1) % 16;
      if(step === 0) bar++;
    }
  }

  function ensureCtx(){
    if(!ac){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0;
      analyser = ac.createAnalyser();
      analyser.fftSize = 1024; analyser.smoothingTimeConstant = .68;
      freq = new Uint8Array(analyser.frequencyBinCount);
      master.connect(analyser); analyser.connect(ac.destination);
      noiseBuf = makeNoise();
      decodeClip("call", callSrc);
      decodeClip("final", finalSrc);
      decodeClip("bark", barkSrc);
      decodeClip("whine", whineSrc);
      decodeClip("naughty", naughtySrc);
      decodeClip("sizzle", sizzleSrc2);
      startSizzle();
    }
    if(ac.state === "suspended") ac.resume();
    return true;
  }

  function start(){
    if(!ensureCtx()) return;

    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setValueAtTime(0.0001, ac.currentTime);
    master.gain.linearRampToValueAtTime(.85, ac.currentTime + .25);

    step = 0; bar = 0; nextTime = ac.currentTime + .06; kicks = [];
    timer = setInterval(schedule, 25);
    running = true;
  }

  function stop(){
    if(!ac) return;
    clearInterval(timer); timer = null;
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setValueAtTime(master.gain.value, ac.currentTime);
    master.gain.linearRampToValueAtTime(0.0001, ac.currentTime + .18);
    running = false; kicks = [];
  }

  var tuneGrid = document.getElementById("tune-grid");
  ["grill", "country", "rocknroll", "merengue", "classical"].forEach(function(key, i){
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button"; b.className = "casing";
    b.style.paddingLeft = "13px";
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.textContent = STYLES[key].name;
    b.addEventListener("click", function(){
      styleKey = key; bar = 0; step = 0;
      if(running) nextTime = ac.currentTime + .05;
      else beginMusic();
      Array.prototype.forEach.call(tuneGrid.querySelectorAll(".casing"), function(o){
        o.setAttribute("aria-pressed", o === b ? "true" : "false");
      });
    });
    li.appendChild(b);
    tuneGrid.appendChild(li);
  });

  var playBtn = document.getElementById("play"), playLabel = document.getElementById("play-label");
  function beginMusic(){
    start();
    playBtn.setAttribute("aria-pressed", "true");
  }

  function endMusic(){
    stop();
    playBtn.setAttribute("aria-pressed", "false");
  }

  playBtn.addEventListener("click", function(){ if(!running) beginMusic(); });
  document.getElementById("stopmusic").addEventListener("click", endMusic);

  /* ================= sauce ================= */
  function stampSauce(x, y, r){
    var g = sctx.createRadialGradient(x - r * .32, y - r * .34, r * .12, x, y, r);
    g.addColorStop(0, "#E9563A"); g.addColorStop(.55, "#C22A18"); g.addColorStop(1, "#8B160C");
    sctx.fillStyle = g; sctx.globalAlpha = .96;
    sctx.beginPath();
    var n = 11, i;
    for(i = 0; i <= n; i++){
      var a = i / n * Math.PI * 2, rr = r * (.74 + Math.random() * .48);
      var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      if(i === 0) sctx.moveTo(px, py); else sctx.lineTo(px, py);
    }
    sctx.closePath(); sctx.fill();
    for(i = 0; i < 3; i++){
      var da = Math.random() * Math.PI * 2, dd = r * (.9 + Math.random() * .9);
      sctx.beginPath();
      sctx.arc(x + Math.cos(da) * dd, y + Math.sin(da) * dd, r * (.1 + Math.random() * .22), 0, 6.283);
      sctx.fill();
    }
    sctx.globalAlpha = 1;
  }

  function dropSauce(n){
    for(var i = 0; i < n; i++){
      drops.push({
        x: cx + (Math.random() - .5) * Math.min(W, H) * 0.30,
        y: -8, vy: 40 + Math.random() * 60,
        r: rBase * (.22 + Math.random() * .22)
      });
    }
  }

  /* ================= fat ================= */
  function toWorld(lx, ly){
    var ox = (lx - cx) * sScale, oy = (ly - cy) * sScale;
    var ca = Math.cos(angle), sa = Math.sin(angle);
    return {x: cx + ox * ca - oy * sa, y: cy + ox * sa + oy * ca + bob};
  }

  function shedFat(){
    var best = null, bestY = -1e9;
    for(var k = 0; k < 10; k++){
      var i = Math.floor(Math.random() * pts.length);
      var side = Math.random() < .5 ? 1 : -1;
      var w = toWorld(pts[i].x + pts[i].nx * rad[i] * side, pts[i].y + pts[i].ny * rad[i] * side);
      if(w.y > bestY){ bestY = w.y; best = w; }
    }
    if(best) fats.push({x: best.x, y: best.y, vy: 0, r: rBase * (.09 + Math.random() * .09), hang: .18 + Math.random() * .25});
  }

  var CLIPS = {}, clipNodes = {};

  function decodeClip(key, uri){
    try{
      var raw = atob(uri.slice(uri.indexOf(",") + 1));
      var arr = new Uint8Array(raw.length);
      for(var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      var done = function(buf){ CLIPS[key] = buf; };
      var r = ac.decodeAudioData(arr.buffer, done, function(){});
      if(r && r.then) r.then(done, function(){});
    }catch(e){}
  }

  function playClip(key, vol, tries){
    if(!ac) return;
    if(!CLIPS[key]){                       /* still decoding on the very first press */
      if((tries || 0) > 40) return;
      setTimeout(function(){ playClip(key, vol, (tries || 0) + 1); }, 40);
      return;
    }
    stopClip(key);
    var s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = CLIPS[key];
    g.gain.value = vol;
    s.connect(g); g.connect(ac.destination);
    s.start();
    clipNodes[key] = s;
  }

  function stopClip(key){
    if(clipNodes[key]){ try{ clipNodes[key].stop(); }catch(e){} clipNodes[key] = null; }
  }

  var sizzleNode = null;
  function startSizzle(tries){
    if(sizzleNode || !ac) return;
    if(!CLIPS.sizzle){
      if((tries || 0) > 60) return;
      setTimeout(function(){ startSizzle((tries || 0) + 1); }, 60);
      return;
    }
    var s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = CLIPS.sizzle; s.loop = true;
    g.gain.value = .22;
    s.connect(g); g.connect(ac.destination);
    s.start();
    sizzleNode = s;
  }

  function hush(){ stopClip("call"); }
  function sendOff(mode){
    if(mode === "sneak"){
      playClip("naughty", 1);
      setTimeout(function(){ playClip("whine", .9); }, 3450);
    } else {
      playClip("final", 1);
    }
  }

  function startDog(mode){
    if(dog || !ensureCtx()) return;
    tillyBtn.disabled = true;
    dog = {phase: "in", t: 0, x: -Math.min(W, H) * 0.4, mouth: 0, mode: mode};
    playClip(mode === "sneak" ? "bark" : "call", mode === "sneak" ? .85 : 1);
  }

  /* she turns up on her own every so often */
  var randOn = false, randTimer = null;
  var randBtn = document.getElementById("rand");

  function scheduleRaid(){
    clearTimeout(randTimer);
    if(!randOn) return;
    randTimer = setTimeout(function(){
      if(randOn && !dog && sScale > .9) startDog("sneak");
      scheduleRaid();
    }, 9000 + Math.random() * 21000);
  }

  randBtn.addEventListener("click", function(){
    randOn = !randOn;
    randBtn.setAttribute("aria-pressed", randOn ? "true" : "false");
    randBtn.textContent = randOn ? "Tilly is loose" : "Let Tilly Loose";
    if(randOn){ ensureCtx(); scheduleRaid(); }
    else clearTimeout(randTimer);
  });

  /* call her: she runs in over the top of it, eats the sausage, then the last word */
  tillyBtn.addEventListener("click", function(){ startDog("called"); });

  function updateDog(dt, S){
    var mark = cx - S * 0.34;
    dog.t += dt;
    if(dog.phase === "in"){
      dog.x += (mark - dog.x) * Math.min(1, dt * 4);
      if(Math.abs(dog.x - mark) < S * 0.02 || dog.t > 2.4){ dog.phase = "eat"; dog.t = 0; }
    } else if(dog.phase === "eat"){
      dog.mouth = Math.abs(Math.sin(dog.t * 9));
      if(dog.t > 0.3) sTarget = 0;
      if(dog.t > 1.9){ dog.phase = "out"; dog.t = 0; sctx.clearRect(0, 0, W, H); drops.length = 0; sendOff(dog.mode); }
    } else {
      dog.mouth = 0; sTarget = 1;
      dog.x += S * 1.4 * dt;
      if(dog.x > W + S * 0.45){ dog = null; tillyBtn.disabled = false; }
    }
  }

  function dogLeg(ox, swing){
    ctx.beginPath();
    ctx.moveTo(ox, 15);
    ctx.lineTo(ox + swing * 13, 40);
    ctx.stroke();
  }

  function drawDog(x, y, sc, mouth, running2, t){
    var c = ctx;
    c.save(); c.translate(x, y); c.scale(sc, sc);
    var sw = running2 ? Math.sin(t * 15) : 0;
    var wag = Math.sin(t * 20) * (running2 ? 14 : 8);
    c.lineCap = "round";

    c.strokeStyle = "#8A5834"; c.lineWidth = 8;
    c.beginPath(); c.moveTo(-42, -6);
    c.quadraticCurveTo(-62, -20 + wag, -72, -34 + wag);
    c.stroke();

    c.strokeStyle = "#7A4C2C"; c.lineWidth = 10;
    dogLeg(-22, -sw); dogLeg(24, sw);

    c.fillStyle = "#A66E40";
    c.beginPath(); c.ellipse(0, 0, 45, 26, 0, 0, 6.283); c.fill();
    c.fillStyle = "rgba(243,231,211,.4)";
    c.beginPath(); c.ellipse(2, 11, 33, 12, 0, 0, 6.283); c.fill();

    c.strokeStyle = "#A66E40"; c.lineWidth = 11;
    dogLeg(-28, sw); dogLeg(18, -sw);

    c.fillStyle = "#A66E40";
    c.beginPath(); c.arc(48, -22, 22, 0, 6.283); c.fill();

    var m = mouth * 15;
    c.fillStyle = "#4A1E18";
    c.beginPath(); c.moveTo(52, -18); c.lineTo(88, -22 - m); c.lineTo(88, -8 + m);
    c.closePath(); c.fill();

    c.save(); c.translate(60, -20); c.rotate(-mouth * 0.28);
    c.fillStyle = "#B87C4A";
    c.beginPath(); c.ellipse(12, -3, 17, 8, 0, 0, 6.283); c.fill();
    c.fillStyle = "#2B1710";
    c.beginPath(); c.arc(27, -5, 4.5, 0, 6.283); c.fill();
    c.restore();

    c.save(); c.translate(60, -14); c.rotate(mouth * 0.3);
    c.fillStyle = "#9C6238";
    c.beginPath(); c.ellipse(11, 3, 14, 6, 0, 0, 6.283); c.fill();
    c.restore();

    c.fillStyle = "#8A5834";
    c.beginPath(); c.ellipse(40, -34, 9, 16, -0.35, 0, 6.283); c.fill();
    c.fillStyle = "#2B1710";
    c.beginPath(); c.arc(55, -27, 3.2, 0, 6.283); c.fill();
    c.restore();
  }

  /* ================= render ================= */
  function bandFor(t){
    var d = Math.abs(t - .5) * 2;
    return Math.min(230, Math.floor(Math.pow(d, 1.55) * 150) + 2);
  }

  function draw(now, dt){
    if(!pts.length) return;
    ctx.clearRect(0, 0, W, H);
    var S = Math.min(W, H), i, lowE = 0;

    if(running && analyser){
      analyser.getByteFrequencyData(freq);
      for(i = 2; i < 12; i++) lowE += freq[i];
      lowE /= (10 * 255);
      while(kicks.length && ac.currentTime >= kicks[0].t){
        var kw = kicks.shift().w;
        pulse = Math.max(pulse, kw);
        spin += 1.4 * kw;
        bobV -= S * 0.85 * kw;                  /* knocked upward by the beat */
        if(sScale > .9){
          dropSauce(Math.random() < kw ? 1 : 0);
          shedFat();
        }
        for(var k = 0; k < 4; k++){
          sizzle.push({t: Math.random(), side: Math.random() < .5 ? 1 : -1, life: 1,
                       vy: .5 + Math.random() * .9, dx: (Math.random() - .5) * .7});
        }
      }
    }
    pulse *= .90;

    /* bounce settles on a spring */
    bobV += (-bob * 190 - bobV * 13) * dt;
    bob += bobV * dt;

    var wantSpin = running ? (0.5 + lowE * 1.4) : 0;
    spin += (wantSpin - spin) * .06;
    if(!reduce.matches || running) angle += spin * dt;

    var target;
    for(i = 0; i < pts.length; i++){
      if(running && freq){
        target = Math.pow(freq[bandFor(pts[i].t)] / 255, 1.15);
      } else {
        target = .26 + .1 * Math.sin(now * 1.15 + pts[i].t * 3.4);
      }
      level[i] += (target - level[i]) * .3;
      var e = Math.min(pts[i].t, 1 - pts[i].t) / .07;
      var taper = e >= 1 ? 1 : (.5 + .5 * Math.sin((e - .5) * Math.PI));
      rad[i] = rBase * taper * (1 + .30 * level[i] + .18 * pulse);
    }

    /* slow fat rendering between beats too */
    if(running && sScale > .9){
      fatTimer -= dt;
      if(fatTimer <= 0){ shedFat(); fatTimer = .5 + Math.random() * .7; }
    }

    /* sauce drops land in the sausage's own frame */
    var ca = Math.cos(-angle), sa = Math.sin(-angle);
    for(i = drops.length - 1; i >= 0; i--){
      var d = drops[i];
      d.vy += 900 * dt; d.y += d.vy * dt;
      if(d.y > H + 20){ drops.splice(i, 1); continue; }
      var ox = d.x - cx, oy = (d.y - bob) - cy;
      var lx = cx + (ox * ca - oy * sa) / sScale, ly = cy + (ox * sa + oy * ca) / sScale;
      var hit = -1, best = 1e9;
      for(var j = 0; j < pts.length; j += 2){
        var dd = Math.hypot(pts[j].x - lx, pts[j].y - ly);
        if(dd < best){ best = dd; hit = j; }
      }
      if(hit >= 0 && best < rad[hit] * .96 && sScale > .9){
        stampSauce(lx, ly, d.r);
        drops.splice(i, 1);
      }
    }

    sScale += (sTarget - sScale) * Math.min(1, dt * (sTarget < sScale ? 9 : 5));

    ctx.save();
    ctx.translate(cx, cy + bob); ctx.rotate(angle); ctx.scale(sScale, sScale); ctx.translate(-cx, -cy);

    function outline(){
      ctx.beginPath();
      var q;
      for(q = 0; q < pts.length; q++){
        var p = pts[q];
        var x = p.x + p.nx * rad[q], y = p.y + p.ny * rad[q];
        if(q === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      var last = pts[pts.length - 1], rl = rad[pts.length - 1], a;
      for(a = 0; a <= 10; a++){
        var an = a / 10 * Math.PI;
        ctx.lineTo(last.x + (last.nx * Math.cos(an) + last.ny * Math.sin(an)) * rl,
                   last.y + (last.ny * Math.cos(an) - last.nx * Math.sin(an)) * rl);
      }
      for(q = pts.length - 1; q >= 0; q--){
        ctx.lineTo(pts[q].x - pts[q].nx * rad[q], pts[q].y - pts[q].ny * rad[q]);
      }
      var first = pts[0], rf = rad[0];
      for(a = 0; a <= 10; a++){
        var an2 = a / 10 * Math.PI;
        ctx.lineTo(first.x - (first.nx * Math.cos(an2) + first.ny * Math.sin(an2)) * rf,
                   first.y - (first.ny * Math.cos(an2) - first.nx * Math.sin(an2)) * rf);
      }
      ctx.closePath();
    }

    ctx.save();
    ctx.shadowColor = casing.glow;
    ctx.shadowBlur = (14 + 34 * pulse) * sScale;
    var g = ctx.createLinearGradient(cx - W * .3, cy - H * .35, cx + W * .3, cy + H * .35);
    g.addColorStop(0, casing.light);
    g.addColorStop(.42, casing.base);
    g.addColorStop(1, casing.dark);
    ctx.fillStyle = g;
    outline(); ctx.fill();
    ctx.restore();

    ctx.save();
    outline(); ctx.clip();

    ctx.strokeStyle = "rgba(30,12,6,.28)";
    ctx.lineWidth = rBase * .5; ctx.lineCap = "round";
    ctx.beginPath();
    for(i = 0; i < pts.length; i++){
      var pc = pts[i], rc = rad[i] * .95;
      var xa = pc.x - pc.nx * rc, ya = pc.y - pc.ny * rc;
      if(i === 0) ctx.moveTo(xa, ya); else ctx.lineTo(xa, ya);
    }
    ctx.stroke();

    for(i = 0; i < specks.length; i++){
      var sp = specks[i];
      var idx = Math.min(pts.length - 1, Math.floor(sp.t * (pts.length - 1)));
      var pp = pts[idx], rr2 = rad[idx];
      ctx.globalAlpha = casing.speckA * (.5 + .5 * level[idx]);
      ctx.fillStyle = casing.speck;
      ctx.beginPath();
      ctx.arc(pp.x + pp.nx * rr2 * sp.o, pp.y + pp.ny * rr2 * sp.o, sp.r * (rBase / 16), 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = "rgba(46,18,8,.42)";
    ctx.lineWidth = Math.max(2, rBase * .22);
    for(i = 8; i < pts.length - 8; i += 13){
      var pg = pts[i], rg = rad[i] * 1.05;
      ctx.globalAlpha = .22 + .42 * level[i];
      ctx.beginPath();
      ctx.moveTo(pg.x + pg.nx * rg, pg.y + pg.ny * rg);
      ctx.lineTo(pg.x - pg.nx * rg, pg.y - pg.ny * rg);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = "rgba(255,244,226,.26)";
    ctx.lineWidth = Math.max(1.5, rBase * .2);
    ctx.beginPath();
    for(i = 0; i < pts.length; i++){
      var ps = pts[i], rs = rad[i] * .5;
      var xs = ps.x + ps.nx * rs, ys = ps.y + ps.ny * rs;
      if(i === 0) ctx.moveTo(xs, ys); else ctx.lineTo(xs, ys);
    }
    ctx.stroke();

    ctx.drawImage(sauceCv, 0, 0, W, H);
    ctx.restore();

    ctx.strokeStyle = "rgba(28,14,8,.5)";
    ctx.lineWidth = Math.max(2, rBase * .18);
    [4, pts.length - 5].forEach(function(ix){
      var p = pts[ix], r = rad[ix] * 1.02;
      ctx.beginPath();
      ctx.moveTo(p.x + p.nx * r, p.y + p.ny * r);
      ctx.lineTo(p.x - p.nx * r, p.y - p.ny * r);
      ctx.stroke();
    });

    for(i = sizzle.length - 1; i >= 0; i--){
      var z = sizzle[i];
      z.life -= .035;
      if(z.life <= 0){ sizzle.splice(i, 1); continue; }
      var zi = Math.min(pts.length - 1, Math.floor(z.t * (pts.length - 1)));
      var zp = pts[zi], zr = rad[zi];
      ctx.globalAlpha = z.life * .8;
      ctx.fillStyle = casing.speck;
      ctx.beginPath();
      ctx.arc(zp.x + zp.nx * zr * z.side + z.dx * (1 - z.life) * 26,
              zp.y + zp.ny * zr * z.side - (1 - z.life) * z.vy * 30,
              1.4 * z.life + .5, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    /* falling fat, in screen space */
    for(i = fats.length - 1; i >= 0; i--){
      var f = fats[i];
      if(f.hang > 0){ f.hang -= dt; }
      else { f.vy += 780 * dt; f.y += f.vy * dt; }
      if(f.y > H + 14){ fats.splice(i, 1); continue; }
      var stretch = 1 + Math.min(1.6, f.vy / 330);
      var fg = ctx.createLinearGradient(f.x, f.y - f.r, f.x, f.y + f.r * stretch);
      fg.addColorStop(0, "rgba(255,248,228,.85)");
      fg.addColorStop(1, "rgba(226,196,140,.55)");
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y, f.r * .8, f.r * stretch, 0, 0, 6.283);
      ctx.fill();
    }

    /* sauce drops, in front */
    for(i = 0; i < drops.length; i++){
      var dr = drops[i];
      ctx.fillStyle = "#C42A17";
      ctx.beginPath();
      ctx.ellipse(dr.x, dr.y, dr.r * .55, dr.r * (.8 + Math.min(1.4, dr.vy / 320)), 0, 0, 6.283);
      ctx.fill();
    }

    if(dog){
      updateDog(dt, S);
      if(dog) drawDog(dog.x, cy + S * 0.34, S / 430, dog.mouth, dog.phase !== "eat", now);
    }
  }

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var last = 0;
  function loop(ms){
    var dt = last ? Math.min(.05, (ms - last) / 1000) : .016;
    last = ms;
    draw(ms / 1000, dt);
    requestAnimationFrame(loop);
  }

  if(window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  window.addEventListener("resize", resize);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
